<div class="flex signInBody text-center">
    <form (submit)="onSubmit()">
        <div>
            <img src="/assets/kw-logo.png" alt="">
        </div>
        <div class="text-left">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="Your Username.." [(ngModel)]="username" required>
            <div *ngIf="errors.username" class="error">
                Please enter a valid Username.
            </div>
        </div>
        <div class="text-left">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="Your Email.." [(ngModel)]="email" required>
            <div *ngIf="errors.email" class="error">
                Please enter a valid email.
            </div>
        </div>
        <div class="text-left">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Your PAssword.." [(ngModel)]="password" required>
            <div *ngIf="errors.password" class="error">
                Please enter a valid password.
            </div>
        </div>

        <input type="submit" value="Submit">
        <p>Already have a account? <span routerLink="/signin" class="text-blue-600 cursor-pointer">SignIn</span></p>
    </form>
</div>
