<!-- Loader -->
<div *ngIf="loading" class="flex justify-center items-center w-full h-[70vh]">
  <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-blue-500"></div>
</div>

<!-- Content -->
<div *ngIf="!loading" class="px-20 w-full">
  <h2 class="text-2xl my-5 font-medium">Discover Handmade Crafts</h2>
  <div class="grid grid-cols-4 content-center w-full">
    <div *ngFor="let item of handmadeItems" class="w-full gap-3">
      <div>
        <img class="books" src={{item.imgUrl}} alt="" width="300px"/>
        <h3 class="text-xl font-medium px-1">{{item.title}}</h3>
        <h4 class="text-md mb-3 px-1 text-gray-400">{{item.description}}</h4>
      </div>
      <div class="flex justify-between items-center px-1 w-[300px]">
        <h4 class="text-lg font-semibold">${{item.price}}</h4>
        <div id="book1" class="bg-blue-500 rounded-md flex justify-evenly items-center gap-1 p-1 px-2 text-white cursor-pointer"
          (click)="addToCartClicked(item)">
          <h6 class="font-bold">Add</h6>
          <img src="/assets/cart-icon-white.png" alt="" width="20px" class="h-[20px]" />
        </div>
      </div>
    </div>
  </div>
</div>
